name: Update Credly badges

on:
  schedule:
    - cron: "17 3 * * 1"   # Mondays, 03:17 UTC
  workflow_dispatch:

permissions:
  contents: write   # the action commits the badge section into README.md

jobs:
  update-readme:
    name: Update README with Credly badges
    runs-on: ubuntu-latest
    steps:
      - name: Badges to README
        uses: pemtajo/badge-readme@408f366310edcfa066ef03ffd99b9324a10988fa # main (2026-05-11)
        with:
          CREDLY_USER: timothy-brennan.7c2b8b5a
          NUMBER_LAST_BADGES: 20

      # The action commits markdown images whose size depends on how Credly
      # stored each image. Re-check out the branch it pushed to and rewrite the
      # section as fixed-width HTML so every badge renders at the same size.
      - name: Check out the updated README
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: main

      - name: Normalize badge sizes
        run: python3 .github/scripts/normalize_badges.py 110

      - name: Commit normalized badges
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          git diff --cached --quiet || git commit -m "Normalize Credly badge sizes"
          git push
